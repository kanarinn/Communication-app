services:
  web:
    build: ./services/web
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway

  gateway:
    build: ./services/gateway
    # Exposed on the host only so `npm run dev` in services/web can proxy to it.
    ports:
      - "8080:8080"
    environment:
      AUTH_URL: http://auth:8080
      CHAT_URL: http://chat:8080
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      - auth
      - chat

  auth:
    build: ./services/auth
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/auth?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy

  chat:
    build: ./services/chat
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/chat?sslmode=disable
      REDIS_ADDR: redis:6379
      AUTH_URL: http://auth:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
